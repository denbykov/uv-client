name: ci

on:
  pull_request:
    branches:
      - '*'
  push:
    branches:
      - main
      - 'release/**'

jobs:  
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
        node-version: '22.x'
      
      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run package
